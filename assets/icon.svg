<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004499;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="110" fill="url(#grad)" filter="url(#shadow)"/>

  <!-- PDF icon (document) -->
  <g transform="translate(180, 120)">
    <!-- Document shape -->
    <path d="M 20 0 L 120 0 L 140 20 L 140 220 L 20 220 Z" fill="#ffffff" opacity="0.95"/>

    <!-- Document fold corner -->
    <polygon points="120,0 140,20 120,20" fill="#e0e0e0" opacity="0.8"/>

    <!-- Red PDF text on document -->
    <text x="70" y="160" font-size="48" font-weight="bold" fill="#dc3545" text-anchor="middle" font-family="Arial">PDF</text>

    <!-- Horizontal lines (text) -->
    <line x1="20" y1="50" x2="140" y2="50" stroke="#cccccc" stroke-width="4" opacity="0.7"/>
    <line x1="20" y1="75" x2="140" y2="75" stroke="#cccccc" stroke-width="3" opacity="0.5"/>
    <line x1="20" y1="95" x2="120" y2="95" stroke="#cccccc" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- Magnifying glass (search) -->
  <g transform="translate(280, 260)">
    <!-- Circle (glass) -->
    <circle cx="35" cy="35" r="28" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.9"/>

    <!-- Handle -->
    <line x1="55" y1="55" x2="85" y2="85" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Checkmark (validation) -->
  <g transform="translate(100, 310)">
    <!-- Checkmark -->
    <polyline points="10,35 30,55 60,15" fill="none" stroke="#4CAF50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  </g>

  <!-- Text: "Escaneando" -->
  <text x="256" y="450" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif" letter-spacing="2">ESCANEANDO</text>

  <!-- Text: "Reader" -->
  <text x="256" y="485" font-size="24" fill="#e0e0e0" text-anchor="middle" font-family="Arial, sans-serif" letter-spacing="1">Reader</text>

  <!-- Subtle shine effect -->
  <ellipse cx="256" cy="130" rx="80" ry="60" fill="#ffffff" opacity="0.08"/>
</svg>
